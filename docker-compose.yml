services:
  db:
    image: postgres:16-alpine
    container_name: odc-meeting-room-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: odc
      POSTGRES_PASSWORD: odc
      POSTGRES_DB: meeting_room
    ports:
      - "5432:5432"
    volumes:
      - odc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odc -d meeting_room"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  odc_pgdata:
